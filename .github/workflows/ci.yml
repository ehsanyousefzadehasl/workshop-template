# Checks every pull request before it can be merged into main.
# Each job is independent, so you see exactly which check failed.

name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build site and check links
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.169.0
    steps:
      - name: Install Hugo
        run: |
          curl -fsSL -o "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Check out the repository (with the Blowfish theme)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # --panicOnWarning turns every Hugo warning (e.g. deprecations) into a failure
      - name: Build the site (strict)
        run: hugo --gc --minify --panicOnWarning --baseURL "/"

      # Checks every internal link and image in the built site, offline
      - name: Check internal links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --offline --no-progress --root-dir "${{ github.workspace }}/public" "public/**/*.html"
          fail: true

  yaml:
    name: Lint YAML data files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install yamllint
        run: pip install yamllint
      # "relaxed" checks syntax and indentation without being picky about style
      - name: Lint data/ and config/
        run: yamllint -d relaxed data/

  docker:
    name: Lint and build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          # Show warnings (e.g. unpinned apt packages) but only fail on errors
          failure-threshold: error
      - name: Build the image (not published)
        run: docker build -t workshop-site:ci .
