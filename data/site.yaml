# ==================================================
# HOMEPAGE SETTINGS — edit this file to make the site yours
# ==================================================
#
# The workshop NAME is set in config/_default/languages.en.toml (title).
# Details of each year (date, place, theme) live in data/editions.yaml.
#
# Any section below can be removed to hide it on the homepage.
# ==================================================

# Small label above the workshop name
label: "Annual Workshop"

# Short line under the name
subtitle: "Ideas. People. Collaboration."

# One or two sentences describing the workshop
description: >-
  A one-day workshop bringing together researchers and practitioners
  to share work in progress, discuss open problems, and start new collaborations.

# General facts about the event, shown as small chips on the homepage.
# Describe the event as a whole, not one year. Remove lines you don't
# want, or delete "facts:" entirely.
facts:
  - icon: "🗓️"
    text: "Every December"
  - icon: "📍"
    text: "Example City"

# The homepage button leads to the current edition. Its default text is
# "Join us in YEAR →" (upcoming edition) or "Relive YEAR →" (past edition).
# Uncomment to use your own text:
# button: "See this year's edition →"

# Colour palette: sage (default) | terracotta | berry
palette: sage

# Optional: use your own main colour instead (any CSS colour)
# accent: "#2563eb"

# ==================================================
# EDITION PAGES
# Which pages each edition has. Order here = order in the
# menu and on the edition overview.
# Set show: false to hide a page from the menu and overview.
# ==================================================
pages:
  - id: speakers
    title: "Speakers"
    description: "Meet the speakers and explore their talks."
    show: true
  - id: program
    title: "Program"
    description: "The schedule for the day."
    show: true
  - id: participation
    title: "Participation"
    description: "Registration, venue and practical details."
    show: true
  - id: organizers
    title: "Organizers"
    description: "Organizing committee and supporting institutions."
    show: true
  - id: resources
    title: "Resources"
    description: "Slides, recordings and other materials."
    show: true
  - id: gallery
    title: "Gallery"
    description: "Photos from the workshop."
    show: true

# ==================================================
# HOMEPAGE SECTIONS
# Add as many as you like; they appear in this order.
# Each section can have:
#   heading: section title (optional)
#   text:    paragraphs, Markdown allowed (optional)
#   cards:   a row of cards with label / title / text (optional)
# Delete a section to remove it from the homepage.
# ==================================================
sections:
  - heading: "About"
    text: |
      Example Workshop brings together researchers and practitioners for a day
      of talks, short presentations and discussion.

      Replace this text with a description of **your** event.

  - heading: "Topics"
    cards:
      - label: "01"
        title: "Foundations"
        text: "Core ideas, methods and theory."
      - label: "02"
        title: "Systems & Tools"
        text: "Software and infrastructure that make the ideas work."
      - label: "03"
        title: "Applications"
        text: "Case studies and real-world use."

  - heading: "Format"
    text: "A one-day program designed for interaction."
    cards:
      - title: "Invited Talks"
        text: "Speakers share perspectives on open challenges."
      - title: "Short Presentations"
        text: "Participants present focused work in progress."
      - title: "Discussion Groups"
        text: "Small groups identify open problems and collaborations."
